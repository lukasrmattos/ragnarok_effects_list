<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Effect Catalog</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --panel-2:#0f141b; --line:#30363d; --text:#e7edf3; --muted:#9aa7b2; --accent:#58a6ff; --accent-2:#79c0ff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); }
    header { position:sticky; top:0; z-index:2; display:grid; gap:14px; padding:16px 18px; background:#0d1117e6; border-bottom:1px solid var(--line); backdrop-filter: blur(10px); box-shadow:0 12px 28px #01040955; }
    h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:0; }
    .titlebar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .repo-link { display:inline-flex; align-items:center; gap:8px; min-height:36px; color:var(--text); text-decoration:none; border:1px solid var(--line); background:#21262d; border-radius:6px; padding:7px 10px; font-weight:600; }
    .repo-link:hover { border-color:#8b949e; background:#30363d; }
    .repo-link svg { width:18px; height:18px; fill:currentColor; flex:0 0 auto; }
    .toolbar { display:grid; grid-template-columns:minmax(240px, 1fr) auto auto auto; gap:10px; align-items:center; }
    .filter-group { display:flex; align-items:center; gap:8px; min-width:0; }
    .toggle-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    input, select, textarea, button { border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:6px; padding:8px 10px; font:inherit; }
    input[type="search"] { width:100%; min-width:0; }
    select { min-width:150px; }
    button { cursor:pointer; background:#1f6feb; border-color:#388bfd; font-weight:600; }
    button:hover { background:#388bfd; }
    main { padding:18px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
    article { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:0 8px 22px #01040933; }
    video, .preview, .missing { width:100%; aspect-ratio:1; display:block; background:#05070a; }
    .preview { position:relative; overflow:hidden; cursor:pointer; }
    .preview img, .preview video { width:100%; height:100%; object-fit:contain; display:block; }
    .preview.no-thumb { display:grid; place-items:center; color:var(--muted); }
    .missing { display:grid; place-items:center; color:var(--muted); }
    .body { padding:12px; display:grid; gap:9px; }
    .meta { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .id { font-weight:700; color:var(--accent); }
    .badge { color:#d0d7de; background:#30363d; border-radius:999px; padding:3px 8px; font-size:12px; }
    .badge.skipped { background:#7d2d34; }
    .badge.sound { background:#216e39; }
    .badge.crashed { background:#8b5a00; }
    .badge.ignore { background:#4b5563; }
    .badges { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    textarea { width:100%; min-height:76px; resize:vertical; }
    .assets { display:flex; flex-wrap:wrap; gap:6px; }
    .assets code { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#d0d7de; background:#0d1117; border:1px solid var(--line); border-radius:4px; padding:3px 6px; font-size:12px; }
    .sound-assets code { border-color:#216e39; }
    label { display:flex; align-items:center; gap:6px; color:var(--muted); }
    .toggle { min-height:36px; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:#161b22; white-space:nowrap; }
    .toggle input { accent-color:var(--accent); }
    .empty { padding:40px; color:var(--muted); text-align:center; }
    .load-panel { max-width:640px; margin:0 auto; display:grid; gap:12px; justify-items:center; }
    .load-panel p { margin:0; line-height:1.5; }
    .load-panel code { color:#d0d7de; background:#0d1117; border:1px solid var(--line); border-radius:4px; padding:2px 5px; }
    @media (max-width: 820px) {
      .toolbar { grid-template-columns:1fr; }
      .filter-group, .toggle-group { justify-content:stretch; }
      .filter-group select, .toggle-group > * { flex:1; }
    }
    @media (max-width: 560px) {
      .titlebar { align-items:flex-start; flex-direction:column; }
      .repo-link { width:100%; justify-content:center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="titlebar">
      <h1>Ragnarok Effect Catalog</h1>
      <a class="repo-link" href="https://github.com/lukasrmattos/ragnarok_effects_list" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub repository">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.69 0 8.25c0 3.64 2.29 6.73 5.47 7.82.4.08.55-.18.55-.4 0-.2-.01-.86-.01-1.56-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.16-.68-.55-.01-.56.63-.01 1.08.6 1.23.85.72 1.25 1.87.9 2.33.69.07-.54.28-.9.51-1.11-1.78-.21-3.64-.92-3.64-4.08 0-.9.31-1.64.82-2.22-.08-.21-.36-1.05.08-2.19 0 0 .67-.22 2.2.85A7.4 7.4 0 0 1 8 3.95c.68 0 1.36.09 2 .28 1.53-1.07 2.2-.85 2.2-.85.44 1.14.16 1.98.08 2.19.51.58.82 1.32.82 2.22 0 3.17-1.87 3.87-3.65 4.08.29.26.54.76.54 1.54 0 1.11-.01 2-.01 2.27 0 .22.15.48.55.4A8.13 8.13 0 0 0 16 8.25C16 3.69 12.42 0 8 0Z"/>
        </svg>
        GitHub
      </a>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search id, description or type">
      <div class="filter-group">
        <select id="filter" aria-label="Filter effects">
          <option value="all">All effects</option>
          <option value="simple">Simple</option>
          <option value="continuous">Continuous</option>
          <option value="unknown">Unknown</option>
          <option value="sound">Sound</option>
          <option value="skipped">Skipped</option>
          <option value="hidden">Hidden</option>
        </select>
      </div>
      <div class="toggle-group">
        <label class="toggle"><input id="showHidden" type="checkbox"> Show hidden</label>
        <label class="toggle"><input id="showImages" type="checkbox"> Show GRF file names loaded by effect</label>
      </div>
      <button id="export">Export JSON</button>
    </div>
  </header>
  <main><div id="catalog" class="grid"></div></main>
  <input id="jsonFile" type="file" accept="application/json,.json" hidden>
  <script>
    const storageKey = 'effectCatalog:' + location.pathname;
    let effects = [];
    let edits = JSON.parse(localStorage.getItem(storageKey) || '{}');
    const audioCache = new Map();
    const maxCachedAudio = 32;

    async function load() {
      try {
        const response = await fetch('effects.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        effects = await response.json();
        render();
      } catch (error) {
        showLoadError(error);
      }
    }

    function showLoadError(error) {
      const root = document.getElementById('catalog');
      root.className = 'empty';
      if (location.protocol === 'file:') {
        root.innerHTML = `
          <div class="load-panel">
            <p>Browser security blocks loading <code>effects.json</code> automatically from a <code>file://</code> page.</p>
            <p>Run a local server, or select <code>effects.json</code> manually.</p>
            <button id="pickJson" type="button">Load effects.json</button>
          </div>
        `;
        document.getElementById('pickJson').addEventListener('click', () => document.getElementById('jsonFile').click());
        return;
      }
      root.textContent = 'Could not load effects.json: ' + error.message;
    }

    async function loadFromFile(file) {
      try {
        effects = JSON.parse(await file.text());
        render();
      } catch (error) {
        document.getElementById('catalog').className = 'empty';
        document.getElementById('catalog').textContent = 'Could not read selected JSON: ' + error.message;
      }
    }

    function merged(effect) {
      return { ...effect, ...(edits[effect.id] || {}) };
    }

    function saveEdit(id, patch) {
      edits[id] = { ...(edits[id] || {}), ...patch };
      localStorage.setItem(storageKey, JSON.stringify(edits));
    }

    function visible(effect) {
      const item = merged(effect);
      const filter = document.getElementById('filter').value;
      const query = document.getElementById('search').value.trim().toLowerCase();
      if (filter !== 'hidden' && !document.getElementById('showHidden').checked && item.hidden) return false;
      if (filter === 'skipped' && !(item.skippedCrash || item.skippedIgnore)) return false;
      if (filter === 'hidden' && !item.hidden) return false;
      if (filter === 'sound' && !item.hasSound) return false;
      if (filter !== 'all' && filter !== 'skipped' && filter !== 'hidden' && filter !== 'sound' && item.type !== filter) return false;
      if (!query) return true;
      return String(item.id).includes(query)
        || (item.description || '').toLowerCase().includes(query)
        || (item.originalDescription || '').toLowerCase().includes(query)
        || (item.assets || []).some(asset => asset.toLowerCase().includes(query))
        || (item.soundAssets || []).some(asset => asset.toLowerCase().includes(query))
        || (item.type || '').toLowerCase().includes(query);
    }

    function render() {
      const root = document.getElementById('catalog');
      root.querySelectorAll('.preview').forEach(stopPreview);
      const list = effects.filter(visible).map(merged);
      const showGrfFiles = document.getElementById('showImages').checked;
      root.className = list.length ? 'grid' : 'empty';
      if (!list.length) {
        root.textContent = 'No effects found.';
        return;
      }
      root.innerHTML = list.map(item => `
        <article>
          ${item.video ? `
            <div class="preview ${item.thumbnail ? '' : 'no-thumb'}" data-video="${escapeHtml(item.video)}" data-audio="${escapeHtml(item.audio || '')}" data-poster="${escapeHtml(item.thumbnail || '')}">
              ${item.thumbnail ? `<img src="${escapeHtml(item.thumbnail)}" alt="">` : 'Preview'}
            </div>
          ` : `<div class="missing">No video</div>`}
          <div class="body">
            <div class="meta">
              <span class="id">#${item.id}</span>
              <span class="badges">
                ${item.hasSound ? '<span class="badge sound">sound</span>' : ''}
                ${item.hidden ? '<span class="badge">hidden</span>' : ''}
                ${item.crashSuspected ? '<span class="badge crashed">crashed</span>' : ''}
                ${item.skippedIgnore ? '<span class="badge ignore">ignore</span>' : ''}
                <span class="badge ${item.skippedCrash ? 'skipped' : ''}">${item.skippedCrash ? 'skipped' : item.type}</span>
              </span>
            </div>
            <textarea data-id="${item.id}">${escapeHtml(item.description || '')}</textarea>
            ${showGrfFiles && (item.assets || []).length ? `<div class="assets">${item.assets.map(asset => `<code>${escapeHtml(asset)}</code>`).join('')}</div>` : ''}
            ${showGrfFiles && (item.soundAssets || []).length ? `<div class="assets sound-assets">${item.soundAssets.map(asset => `<code>${escapeHtml(asset)}</code>`).join('')}</div>` : ''}
          </div>
        </article>
      `).join('');
      root.querySelectorAll('.preview').forEach(preview => {
        preview.addEventListener('pointerenter', () => startPreview(preview));
        preview.addEventListener('pointerleave', () => stopPreview(preview));
      });
      root.querySelectorAll('textarea').forEach(el => {
        el.addEventListener('input', () => saveEdit(el.dataset.id, { description: el.value }));
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }

    function startPreview(preview) {
      if (preview._video || !preview.dataset.video) return;
      const video = document.createElement('video');
      video.src = preview.dataset.video;
      if (preview.dataset.poster) video.poster = preview.dataset.poster;
      video.preload = 'auto';
      video.loop = true;
      video.muted = true;
      video.playsInline = true;

      let audio = null;
      if (preview.dataset.audio) {
        audio = getCachedAudio(preview.dataset.audio);
        audio.loop = true;
      }

      preview.textContent = '';
      preview.appendChild(video);
      preview._video = video;
      preview._audio = audio;

      video.currentTime = 0;
      video.play().catch(() => {});
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }
    }

    function getCachedAudio(src) {
      let audio = audioCache.get(src);
      if (!audio) {
        audio = new Audio(src);
        audio.preload = 'auto';
        audioCache.set(src, audio);
        audio.load();
      } else {
        audioCache.delete(src);
        audioCache.set(src, audio);
      }
      while (audioCache.size > maxCachedAudio) {
        const [oldSrc, oldAudio] = audioCache.entries().next().value;
        oldAudio.pause();
        oldAudio.removeAttribute('src');
        oldAudio.load();
        audioCache.delete(oldSrc);
      }
      return audio;
    }

    function stopPreview(preview) {
      const video = preview._video;
      const audio = preview._audio;
      if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
        video.remove();
      }
      if (audio) {
        audio.pause();
      }
      preview._video = null;
      preview._audio = null;
      if (preview.dataset.poster) {
        preview.innerHTML = `<img src="${escapeHtml(preview.dataset.poster)}" alt="">`;
      } else {
        preview.textContent = 'Preview';
      }
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('filter').addEventListener('change', render);
    document.getElementById('showHidden').addEventListener('change', render);
    document.getElementById('showImages').addEventListener('change', render);
    document.getElementById('jsonFile').addEventListener('change', event => {
      const [file] = event.target.files;
      if (file) loadFromFile(file);
      event.target.value = '';
    });
    document.getElementById('export').addEventListener('click', () => {
      const data = JSON.stringify(effects.map(merged), null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'effects.updated.json';
      link.click();
      URL.revokeObjectURL(url);
    });
    load();
  </script>
</body>
</html>
